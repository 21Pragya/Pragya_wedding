<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Wedding Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="floating-hearts" id="floatingHearts" aria-hidden="true"></div>

  <div class="page">
    <header class="header">
      <div class="ornament-row">
        <span class="ornament-line"></span>
        <svg width="18" height="16" viewBox="0 0 18 16" class="heart-icon"><path d="M9 15.5C9 15.5 1 10.5 1 5.2 1 2.6 3 1 5.3 1 6.9 1 8.3 1.9 9 3.2 9.7 1.9 11.1 1 12.7 1 15 1 17 2.6 17 5.2 17 10.5 9 15.5 9 15.5Z" fill="#C9A227"/></svg>
        <span class="ornament-line"></span>
      </div>
      <h1 class="title">Our Wedding Checklist</h1>
      <p class="subtitle">every little thing, kept in one pretty place</p>

      <div class="progress-wrap">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="overallProgressFill" style="width:0%"></div>
        </div>
        <div class="progress-label-row">
          <span class="progress-label" id="overallProgressLabel">0 of 0 sorted</span>
          <span class="progress-pct" id="overallProgressPct">0%</span>
        </div>
      </div>

      <p class="live-note" id="connStatus">connecting…</p>
    </header>

    <div class="add-category-wrap">
      <input type="text" id="newCategoryInput" placeholder="New category, e.g. Flowers" maxlength="60" />
      <button id="addCategoryBtn" aria-label="Add category">
        <svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 2v14M2 9h14" stroke="#FBF7F2" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div id="errorBanner" class="error-banner" hidden></div>

    <div id="emptyState" class="empty-state" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2l1.6 5.2L19 9l-5.4 1.8L12 16l-1.6-5.2L5 9l5.4-1.8L12 2z" fill="#C9A227"/></svg>
      <p>No categories yet. Start with something like "Venue" or "Catering".</p>
    </div>

    <div class="category-list" id="categoryList"></div>

    <footer class="footer-ornament">
      <span class="ornament-line"></span>
      <span class="footer-text">made with love, one checkbox at a time</span>
      <span class="ornament-line"></span>
    </footer>
  </div>

  <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
